version: "3.9"

# ============================================================
#  HOMELAB STACK — Root Compose
#  Avvia tutto con: docker compose up -d
#  Oppure per dominio: docker compose -f networking/docker-compose.yml up -d
# ============================================================

include:
  - networking/docker-compose.yml
  - monitoring/docker-compose.yml
  - automation/docker-compose.yml
  - ai/docker-compose.yml
  - security/docker-compose.yml

networks:
  homelab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Networking
  adguard_data:
  adguard_conf:
  # Monitoring
  prometheus_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:
  # Automation
  n8n_data:
  semaphore_data:
  netbox_data:
  netbox_postgres:
  netbox_redis:
  # AI
  ollama_data:
  anythingllm_data:
  # Security
  authelia_data:
  # Home Assistant
  homeassistant_data:
